name: Website QA
on:
  pull_request:
    paths:
      - '**/*.html'
      - '**/*.css'
      - '.github/workflows/site-qa.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate static pages, links, and assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit, unquote
          import sys
          root=Path('.').resolve()
          errors=[]
          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.links=[]; self.headings=[]; self.viewport=False; self.title=False
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag in ('a','link','script','img') and (a.get('href') or a.get('src')):
                      self.links.append(a.get('href') or a.get('src'))
                  if tag=='h1': self.headings.append(tag)
                  if tag=='meta' and a.get('name')=='viewport': self.viewport=True
                  if tag=='title': self.title=True
          pages=list(root.rglob('*.html'))
          for page in pages:
              if '.git' in page.parts: continue
              p=Parser()
              try: p.feed(page.read_text(encoding='utf-8'))
              except Exception as exc: errors.append(f'{page}: parse error: {exc}'); continue
              if len(p.headings)!=1: errors.append(f'{page}: expected one h1, found {len(p.headings)}')
              if not p.viewport: errors.append(f'{page}: missing viewport')
              if not p.title: errors.append(f'{page}: missing title')
              for link in p.links:
                  if link.startswith(('#','mailto:','tel:','data:','javascript:','https:','http:','//')): continue
                  url=unquote(urlsplit(link).path)
                  target=(page.parent/url).resolve()
                  if not target.is_relative_to(root): errors.append(f'{page}: path escapes site: {link}'); continue
                  if not (target.is_file() or (target.is_dir() and (target/'index.html').is_file())):
                      errors.append(f'{page}: broken local link {link}')
          print(f'Checked {len(pages)} HTML pages')
          if errors:
              print('\n'.join(errors)); sys.exit(1)
          print('PASS: headings, viewport, titles, and internal links')
          PY

  visual:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser testing tools
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run mobile and desktop rendering checks
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/keviero-http.log 2>&1 &
          node .github/scripts/visual-qa.cjs
      - name: Upload visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-visual-qa
          path: visual-qa/
          if-no-files-found: ignore
          retention-days: 14
